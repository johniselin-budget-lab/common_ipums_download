# =============================================================================
# parameters.cps.yaml — Budget Lab common CPS ASEC extract
#
# Added 2026-08-19 for the Tax-Simulator non-filer residual workstream
# (other/state_tax_research/nonfiler_residual_design.md §3.2, §4.1): the filing
# model is estimated on the CPS ASEC and transferred to the ACS, so the ASEC is
# the models' native environment (both Cilke 1998 and Mok 2017 estimated there).
#
# Per the design memo's rule, this is a COMMON extract in the shared store, not
# a project-local pull — Affordability-Index and the state-data imputation plan
# (state_data_imputation_plan.md, 2026-08-18 note) consume the same file. Add
# variables here rather than forking a new extract.
#
#   Rscript download_ipums.R config/parameters.cps.yaml
#
# Every sample and variable below was validated against the IPUMS API on
# 2026-08-19 (original 71) and 2026-08-23 (the twelve A2b additions): available
# in all 11 samples. Three requested names were rejected by the API and are
# documented in place rather than dropped silently — see the A2b block.
# =============================================================================

collection: cps
description: "Budget Lab common CPS ASEC extract (filing model, tax units, income detail)"

# -----------------------------------------------------------------------------
# Samples. ASEC year Y asks about income in calendar year Y-1, so the sample IDs
# below cover INCOME YEARS 2014-2024 — deliberately, not incidentally:
#   cps2018_03s -> TY2017   } the two residual-anchor years
#   cps2023_03s -> TY2022   }
#   cps2015_03s, cps2017_03s..cps2020_03s -> TY2014, TY2016-2019, the back years
#                            design memo §8 needs once back-year weights are fit
# cps2025_03s (TY2024) is the latest released; ASEC 2026 lands ~Sept 2026.
# -----------------------------------------------------------------------------
samples:
  - cps2015_03s   # TY2014
  - cps2016_03s   # TY2015
  - cps2017_03s   # TY2016
  - cps2018_03s   # TY2017  <- anchor year
  - cps2019_03s   # TY2018
  - cps2020_03s   # TY2019
  - cps2021_03s   # TY2020
  - cps2022_03s   # TY2021
  - cps2023_03s   # TY2022  <- anchor year
  - cps2024_03s   # TY2023
  - cps2025_03s   # TY2024

variables:
  # --- identifiers and weights -------------------------------------------------
  - YEAR
  - SERIAL
  - MONTH
  - CPSID
  - CPSIDP
  - ASECFLAG
  - ASECWTH
  - ASECWT
  - PERNUM

  # --- geography ---------------------------------------------------------------
  - STATEFIP
  - COUNTY

  # --- universe ----------------------------------------------------------------
  # GQ matters here: Mok's CPS frame EXCLUDES the institutionalized and
  # military-barracks populations, but the PUF universe INCLUDES group quarters
  # (design memo §3.0). Carrying GQ is what lets those records be scored under a
  # stated assumption and reported separately, rather than silently swept in.
  - GQ

  # --- household / family / tax-unit structure ---------------------------------
  - RELATE
  - FAMUNIT
  - FAMSIZE
  - NCHILD
  - NCHLT5
  - ELDCH
  - YNGCH
  - MARST
  - SPLOC
  - MOMLOC
  - POPLOC

  # --- demographics (Mok covariates: education, race, ethnicity) ---------------
  - AGE
  - SEX
  - RACE
  - HISPAN
  - CITIZEN
  - EDUC
  - DISABWRK

  # --- labor -------------------------------------------------------------------
  - EMPSTAT
  - LABFORCE
  - CLASSWKR
  - WKSWORK1
  - UHRSWORKLY
  - WORKLY
  - SRCEARN

  # --- income components -------------------------------------------------------
  # Mok's probits use PRESENCE indicators for wages / interest / dividends /
  # self-employment / rent / retirement / Social Security, plus log gross income
  # and a negative-income indicator. All of those are built from this block.
  - INCTOT
  - INCWAGE
  - OINCWAGE
  - INCLONGJ
  - INCBUS
  - INCFARM
  - INCSS
  - INCSSI
  - INCWELFR
  - INCRETIR
  - INCINT
  - INCDIVID
  - INCRENT
  - INCUNEMP
  - INCWKCOM
  - INCVET
  - INCSURV
  - INCDISAB
  - INCEDUC
  - INCCHILD
  - INCASIST
  - INCOTHER
  - FTOTVAL

  # --- means-tested transfers and Medicaid (Mok covariates) --------------------
  # NOTE the CPS spellings: FOODSTAMP (not the ACS FOODSTMP) and HIMCAIDLY /
  # HIMCARELY (not the ACS HINSCAID / HINSCARE). The ACS names 400 here.
  - FOODSTAMP
  - HIMCAIDLY
  - HIMCARELY

  # --- A2b additions (2026-08-23, Tax-Simulator task A2b) ----------------------
  # Every name below was validated against the IPUMS API across ALL ELEVEN
  # samples before being added, by submitting a probe extract and reading the
  # rejection. That step is not optional here: download_ipums.R PRUNES
  # unavailable variables from the API error and continues, which is right for
  # optional variables and wrong for these — INCPEN1/INCPEN2/INCRANN block
  # Tax-Simulator task C5 and LINENO blocks C2, so a silent prune would produce
  # an extract that looks complete and cannot do the job.
  #
  # Pension and annuity income. The ASEC 2019 redesign moved these out from
  # under the variables we were pulling, so the extract silently lost pension
  # income from TY2018 on — and the two residual-anchor years (TY2017, TY2022)
  # straddle that break, which is what made it worth finding.
  - INCPEN1
  - INCPEN2
  - INCRANN
  - SRCPEN1
  - SRCPEN2
  - INCRET1
  - INCRET2
  # Person line number: resolves DEPSTAT's pointers exactly. Accounts for 100%
  # of the unresolved pointers in the TY2017/TY2022 diagnostics.
  - LINENO
  # Census subfamily identification. IPUMS CPS has NO SUBFAM/SFTYPE/SFRELATE
  # (those are IPUMS USA), so subfamilies must be reconstructed from
  # MOMLOC/POPLOC/SPLOC plus these three.
  - FAMREL
  - FTYPE
  - FAMID
  # Capital gains. NOTE: requested as CAPGAIN/CAPLOSS, which do NOT EXIST in
  # IPUMS CPS — the variable is INCCAPG. Used only in the income measure that is
  # REPORTED and compared to SOI AGI; the measure the transplanted Mok
  # coefficients are scored on EXCLUDES gains. Never mix the two.
  - INCCAPG
  #
  # NOT AVAILABLE, and dropped rather than left as a silent prune:
  #   INCALIM  — alimony. Neither INCALIM nor INCALOTH exists in any of the
  #              eleven samples (API-verified 2026-08-23). Alimony has no
  #              separate IPUMS CPS variable for these years; it is inside
  #              INCASIST / INCOTHER, both already pulled. Mok's AGI list wants
  #              it separately and we cannot have it — a documented limitation,
  #              not an oversight.
  #   CAPGAIN / CAPLOSS — wrong names for a real variable; see INCCAPG above.

  # --- Census tax-model recodes ------------------------------------------------
  # *** STANDING RULE (Tax-Simulator decisions log S12, JI 2026-08-23):
  # *** CENSUS-DERIVED TAX VARIABLES ARE FOR VERIFYING OUR WORK, NEVER FOR
  # *** PRODUCING IT. Everything in this block — FILESTAT, ADJGINC, TAXINC,
  # *** FEDTAX, STATETAX, EITCRED, FICA, MARGTAX — and DEPSTAT wherever it is
  # *** used as a filing-unit pointer rather than a relationship, may appear in
  # *** a diagnostic, a comparison table or an acceptance check. It may NOT
  # *** enter a tax unit's construction, an income concept, a model's
  # *** covariates, a calibration target, or any imputation.
  #
  # Research pass A established why, with three independent disqualifications:
  # ADJGINC/TAXINC are statistically matched to the SOI PUF, the same file this
  # work exists to correct (circular); FILESTAT's filer COUNT is calibrated to
  # administrative filing totals, so using it would make the filing model's own
  # acceptance gate pass by construction; and it is wrong where it is not
  # circular — head-of-household 41.5% short in TY2022, MFS absent entirely,
  # FILESTAT broken outright in TY2020-21, DEPSTAT broken in TY2014, and 10.8%
  # of its dependents pointing at someone the same model codes as a non-filer.
  # They are kept in the extract precisely BECAUSE they are independent of our
  # estimates, which is what makes them good verification.
  - FILESTAT
  - DEPSTAT
  - ADJGINC
  - TAXINC
  - FEDTAX
  - STATETAX
  - EITCRED
  - FICA
  - MARGTAX

  # --- CPS-ASEC-Corrected additions (2026-09-01) --------------------------------
  # The corrected-ASEC project (johniselin-budget-lab/CPS-ASEC-Corrected) reads
  # this same run — by decision it extends the common extract rather than adding
  # a companion layer, replicate weights included. Every name below was
  # API-verified on 2026-09-01 by probe extracts against cps2025_03s (#41) and
  # cps2015_03s (#42). Per-year gaps are legitimate and pruned by the program;
  # they are listed in place so nobody reads a pruned variable as a mistake:
  #   ASECWTCVD                       2020-2021 samples only (pandemic weight)
  #   INCPEN1/2 INCRET1/2 INCRANN     2019+ (already in the A2b block above)
  #   INCRINT1/2 SRCRINT1/2           2019+ (post-redesign retirement detail)
  #   ANYCOVLY PUBCOVLY PRVTCOVLY     2019+ (health-coverage redesign)
  #   HOUSSUB                         cps2015_03s only (rejected for 2016+; re-pull 2026-09-01)
  # Names that do NOT exist (API "Invalid variable name", 2026-09-01) and must
  # not be re-added: FLSUP FL665 SUPIMP ASECIMP PRSUPINT HSUPINT (guesses for
  # the whole-supplement flag — see UH_SUPREC_A2 below), SPMENERGY (-> SPMHEAT),
  # SPMFEDTAX (-> SPMFEDTAXAC / SPMFEDTAXBC), SPMTENURE (-> SPMMORT), SPMHEAD
  # (no IPUMS CPS equivalent).
  #
  # Design-based variance: the 160 ASEC successive-difference replicate weights,
  # household and person. Roughly quadruples the file, accepted by decision so
  # the shared file carries everything the correction models need.
  - REPWT
  - REPWTP
  - ASECWTCVD
  # Whole-supplement imputation status (Census form CPS-665 record match). Only
  # exists as an UNHARMONIZED IPUMS variable, 2007-2025: 0 = no supplement
  # record, values imputed; 1 = answered supplement; 2 = basic record only,
  # imputed; 3 = partial supplement, imputed. This is what the drop-and-
  # reweight step keys on. Source: cps.ipums.org UH_SUPREC_A2 page + IPUMS
  # forum threads 4013 / 7075, 2026-09-01; API-accepted for 2015 and 2025.
  - UH_SUPREC_A2
  # Technical: month-in-sample, the SCHIP oversample indicators.
  - MISH
  - ASECOVERH
  - ASECOVERP
  # Household income, tenure, family count.
  - HHINCOME
  - HHTENURE
  - NFAMS
  # Program receipt and amounts beyond FOODSTAMP (SNAP months/persons/value,
  # energy assistance, public housing / rent subsidy, school lunch, WIC, child
  # care need).
  # NB: FOODSTAMP (already above) is the poverty-module FAMILY MARKET VALUE of
  # SNAP repeated on person records; household RECEIPT is FOODSTMP and the
  # household dollar value is STAMPVAL (flag QSTAMPVA).
  - FOODSTMP
  - STAMPMO
  - STAMPNO
  - STAMPVAL
  - HEATSUB
  - HEATVAL
  - PUBHOUS
  - RENTSUB
  - ATELUNCH
  - LUNCHSUB
  - FRELUNCH
  - GOTWIC
  - KIDCNEED
  # Supplemental Poverty Measure block (Census SPM research file, via IPUMS)
  # and the official poverty variables — the acceptance-test yardsticks.
  - SPMPOV
  - SPMTOTRES
  - SPMTHRESH
  - SPMWT
  - SPMFAMUNIT
  - SPMGEOADJ
  - SPMSNAP
  - SPMLUNCH
  - SPMWIC
  - SPMCAPHOUS
  - SPMHEAT
  - SPMFEDTAXAC
  - SPMFEDTAXBC
  - SPMSTTAX
  - SPMFICA
  - SPMEITC
  - SPMMEDXPNS
  - SPMWKXPNS
  - SPMCHXPNS
  - SPMCHSUP
  - SPMCAPXPNS
  - SPMFTOTVAL
  - SPMMORT
  - SPMNPERS
  - SPMNCHILD
  - SPMNADULTS
  - OFFPOV
  - OFFCUTOFF
  - OFFPOVUNIV
  - POVERTY
  - CUTOFF
  - OFFTOTVAL
  # Poverty-module valuations of housing subsidy and school lunch (Census
  # imputed values on the public file; HOUSSUB only available for 2015).
  - HOUSSUB
  - SCHLLUNCH
  # Income-source detail: which program a dollar came from (the OASDI / SSI /
  # disability / survivor confusion the misreporting literature documents),
  # "received but no amount" indicators, weeks unemployed, and covariates the
  # receipt and reweighting models use.
  - SRCWELFR
  - SRCUNEMP
  - SRCEDUC
  - SRCSURV1
  - SRCSURV2
  - SRCDISA1
  - SRCDISA2
  - SRCRINT1
  - SRCRINT2
  - INCSURV1
  - INCSURV2
  - INCDISA1
  - INCDISA2
  - INCRINT1
  - INCRINT2
  - WHYSS1
  - WHYSS2
  - WHYSSI1
  - WHYSSI2
  - GOTVDISA
  - GOTVEDUC
  - GOTVOTHE
  - GOTVPENS
  - GOTVSURV
  - WKSUNEM1
  - WHYNWLY
  - VETSTAT
  - NATIVITY
  - DIFFANY
  - HEALTH
  - PENSION
  - ANYCOVLY
  - PUBCOVLY
  - PRVTCOVLY
  - HICHAMP
  # Self-employment components (the flags attach here, not to INCBUS/INCFARM).
  - OINCBUS
  - OINCFARM

# Allocation (imputation) flags on the income items the filing model reads, so
# downstream code can screen allocated values — the ~17% ASEC income
# understatement (design memo §3.2.4) enters through exactly these variables.
# The program prunes any flag a given year does not offer and keeps the variable.
# In CPS the flags attach to the COMPONENT variables (OINCWAGE, OINCBUS,
# INCLONGJ, INCINT, INCDIVID, INCOTHER), not the aggregates — asking for a flag
# on INCTOT / INCWAGE / INCBUS returns "does not have any data quality flags"
# and 400s the extract. Verified against the Q-flags present in the existing
# CPS DDIs in the store (QOINCWAGE, QOINCBUS, QINCLONG, QINCINT, QINCDIVI,
# QINCOTHE). Anything unavailable for a given year is pruned automatically.
data_quality_flags:
  - OINCWAGE
  - INCLONGJ
  - INCINT
  - INCDIVID
  - INCOTHER
  - INCRENT
  - INCSS
  - INCRETIR
  # CPS-ASEC-Corrected additions (2026-09-01), API-verified as carrying a flag in
  # cps2025_03s; the program prunes per year (INCRANN's flag is 2019+, e.g.).
  # Requested and REJECTED ("does not have any data quality flags"): FOODSTAMP,
  # HEATVAL, HIMCAIDLY, INCBUS, INCDISAB, INCPEN1, INCPEN2, INCSURV, SPMTOTRES —
  # so SNAP value is screened via STAMPVAL's flag, self-employment via
  # OINCBUS/OINCFARM, and Medicaid / disability / survivor / pension receipt
  # cannot be screened for allocation from public IPUMS flags.
  - INCSSI
  - INCWELFR
  - INCUNEMP
  - INCWKCOM
  - INCVET
  - INCRET1
  - INCRET2
  - INCRANN
  - INCEDUC
  - INCCHILD
  - INCASIST
  - INCFARM
  - OINCBUS
  - OINCFARM
  - STAMPVAL
  - STAMPMO
  - PUBHOUS
  - RENTSUB
  - HEATSUB
  - ATELUNCH
  - LUNCHSUB
  - FRELUNCH
  - GOTWIC
  - INCSURV1
  - INCSURV2
  - INCDISA1
  - INCDISA2

# No case selection: keep every record, including group quarters. Same rule as
# the common ACS extract — downstream projects filter, the shared file does not.
case_selections: {}

output:
  save_location: /nfs/roberts/project/pi_nrs36/shared/raw_data/CPS-ASEC
  id: cps_asec_common
  layout: per_year          # one immutable folder per ASEC year; cheap annual refresh
  data_prefix: cps
  keep_fixed_width: true
  write_parquet: false      # see note below
  pooled_parquet: false     # see note below
  count_records: true

# Parquet is off deliberately. On this cluster the personal library's Arrow 24
# lacks zstd and shadows the module's Arrow 17, which breaks parquet writes
# (~/.claude/CLAUDE.md). The fixed-width .dat.gz + DDI is the canonical form and
# reads fine via ipumsr::read_ipums_micro(); turn parquet on only from a session
# where the module's Arrow is confirmed first on .libPaths().
